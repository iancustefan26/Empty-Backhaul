# Ground-truth labels for the Analyst.
#
# Each row pins the expected (truck, load) compliance verdict against the
# seeded fixtures. Used by `scripts/run_eval.py` to compute precision/recall
# of the live LLM, and by `test_eval_smoke.py` to assert the deterministic
# mock evaluator stays at 100% accuracy.
#
# Schema:
#   truck_plate         : seeded plate number (must exist in trucks table)
#   load_id             : seeded load_requests.id
#   expected_compliant  : true | false
#   expected_blocker    : (optional) substring of a rule-id we expect among cited_rule_ids when blocked
#   rationale           : human-readable why; not used by the harness, but useful for review
#
# Coverage targets:
#   - All 4 README worked-demo trucks × the loads the README explicitly calls out (14 rows)
#   - The 2 real LLM bugs from QA (B-909+L4, OR-404+L15)
#   - The borderline calls from QA (now codified)
#   - A representative spread of clear-cut blockers per rule (capability, logger, chemicals, forbidden)

cases:
  # ---- B-202-CBO  (pharma_2_8 + logger, last=pharma, in Cluj-Napoca) ----
  - truck_plate: B-202-CBO
    load_id: 1
    expected_compliant: true
    rationale: "pharma 2-8°C load matches truck capability + logger; pickup in same city as truck"
  - truck_plate: B-202-CBO
    load_id: 14
    expected_compliant: true
    rationale: "another pharma load — same compatibility profile"
  - truck_plate: B-202-CBO
    load_id: 3
    expected_compliant: false
    expected_blocker: temp.chilled-band
    rationale: "pharma_2_8 truck cannot carry raw_poultry (needs chilled or multi_temp)"
  - truck_plate: B-202-CBO
    load_id: 7
    expected_compliant: false
    expected_blocker: temp
    rationale: "pharma_2_8 truck cannot carry frozen_vegetables (needs frozen/multi_temp)"

  # ---- B-909-CBO  (chilled, last=raw_meat, NO wash, in Sibiu) ----
  - truck_plate: B-909-CBO
    load_id: 4
    expected_compliant: true
    rationale: "raw_meat → raw_meat continuation OK; load.forbidden=[chemicals] does not include raw_meat (the QA-bug fix)"
  - truck_plate: B-909-CBO
    load_id: 19
    expected_compliant: true
    rationale: "raw_meat → raw_meat continuation OK"
  - truck_plate: B-909-CBO
    load_id: 16
    expected_compliant: true
    rationale: "raw_meat → raw_poultry continuation OK (both in chilled-meat band, no wash needed)"
  - truck_plate: B-909-CBO
    load_id: 5
    expected_compliant: false
    expected_blocker: forbidden-prior-cargo
    rationale: "dairy load forbids raw_meat priors and truck has no ANSVSA wash"
  - truck_plate: B-909-CBO
    load_id: 6
    expected_compliant: false
    expected_blocker: forbidden-prior-cargo
    rationale: "dairy load forbids raw_meat priors; no wash"
  - truck_plate: B-909-CBO
    load_id: 1
    expected_compliant: false
    expected_blocker: temp.chilled-band
    rationale: "chilled truck cannot carry pharma 2-8°C; also forbidden_prior_cargo applies"
  - truck_plate: B-909-CBO
    load_id: 7
    expected_compliant: false
    expected_blocker: temp
    rationale: "chilled cannot carry frozen_vegetables"

  # ---- OR-404-CBO  (multi_temp, last=raw_meat, valid ANSVSA wash, in Timisoara) ----
  - truck_plate: OR-404-CBO
    load_id: 3
    expected_compliant: true
    rationale: "raw_meat → raw_poultry continuation OK; same city pickup"
  - truck_plate: OR-404-CBO
    load_id: 7
    expected_compliant: true
    rationale: "multi_temp can carry frozen_veg; no forbidden-prior issue"
  - truck_plate: OR-404-CBO
    load_id: 15
    expected_compliant: true
    rationale: "dairy with raw_meat forbidden BUT valid ANSVSA wash unblocks (the QA-bug fix; matches README headline)"
  - truck_plate: OR-404-CBO
    load_id: 5
    expected_compliant: true
    rationale: "dairy unblocked by ANSVSA wash override"
  - truck_plate: OR-404-CBO
    load_id: 11
    expected_compliant: true
    rationale: "produce unblocked by ANSVSA wash override (raw_meat→produce)"

  # ---- OR-303-CBO  (frozen-only, last=frozen, in Timisoara) ----
  - truck_plate: OR-303-CBO
    load_id: 7
    expected_compliant: true
    rationale: "frozen_veg matches frozen capability; same-city pickup"
  - truck_plate: OR-303-CBO
    load_id: 8
    expected_compliant: true
    rationale: "frozen_veg matches; pickup in Constanta (deadhead)"
  - truck_plate: OR-303-CBO
    load_id: 9
    expected_compliant: true
    rationale: "frozen_fish matches frozen"
  - truck_plate: OR-303-CBO
    load_id: 1
    expected_compliant: false
    expected_blocker: temp
    rationale: "frozen-only cannot carry pharma 2-8°C"
  - truck_plate: OR-303-CBO
    load_id: 5
    expected_compliant: false
    expected_blocker: temp
    rationale: "frozen-only cannot carry chilled dairy"
  - truck_plate: OR-303-CBO
    load_id: 12
    expected_compliant: true
    rationale: "frozen truck CAN carry ambient_dry — ambient is sub-set of frozen capability"
  - truck_plate: OR-303-CBO
    load_id: 18
    expected_compliant: true
    rationale: "same as L12"
  - truck_plate: OR-303-CBO
    load_id: 13
    expected_compliant: false
    expected_blocker: temp
    rationale: "frozen-only cannot carry chemicals (ambient/chilled/multi_temp only)"

  # ---- B-808-CBO  (multi_temp, last=clean, in Constanta) ----
  - truck_plate: B-808-CBO
    load_id: 8
    expected_compliant: true
    rationale: "clean prior + multi_temp + 0-km pickup → maximum flexibility"
  - truck_plate: B-808-CBO
    load_id: 9
    expected_compliant: true
    rationale: "clean prior allows frozen_fish"
  - truck_plate: B-808-CBO
    load_id: 1
    expected_compliant: false
    expected_blocker: gdp.pharma-temperature-and-logger
    rationale: "pharma load requires logger; B-808 has none"
  - truck_plate: B-808-CBO
    load_id: 13
    expected_compliant: true
    rationale: "clean → chemicals OK, multi_temp can carry chemicals"

  # ---- Targeted sanity-layer regression rows (ensure the merge logic stays correct) ----
  - truck_plate: B-101-CBO
    load_id: 1
    expected_compliant: false
    expected_blocker: temp.chilled-band
    rationale: "chilled truck (B-101 last=dairy) cannot carry pharma 2-8°C"
  - truck_plate: B-101-CBO
    load_id: 5
    expected_compliant: true
    rationale: "B-101 last=dairy → dairy continuation OK; chilled capability matches"
  - truck_plate: B-707-CBO
    load_id: 9
    expected_compliant: true
    rationale: "B-707 frozen-only + 0-km Constanta → frozen_fish ideal"
