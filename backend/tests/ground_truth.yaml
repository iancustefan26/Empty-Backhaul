    rule_category: temperature
    expected_blocker: temp.chilled-band
    rationale: "chilled cannot carry pharma 2-8°C"
  - truck_plate: B-101-CBO       # chilled carrying frozen veg — mismatch
    load_id: 7
    expected_compliant: false
    rule_category: temperature
    expected_blocker: temp
    rationale: "chilled cannot carry frozen_vegetables"
  - truck_plate: B-101-CBO       # chilled carrying chilled dairy — match
    load_id: 5
