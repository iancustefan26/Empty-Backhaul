  - truck_plate: OR-303-CBO      # frozen-only carrying pharma — mismatch
    load_id: 1
    expected_compliant: false
    rule_category: temperature
    expected_blocker: temp
    rationale: "frozen-only cannot carry pharma 2-8°C"
  - truck_plate: OR-303-CBO      # frozen-only carrying chilled dairy — mismatch
    load_id: 5
