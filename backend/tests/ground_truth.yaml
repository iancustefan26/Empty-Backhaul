# Ground-truth labels for the Analyst.
#
# Each row pins the expected (truck, load) compliance verdict against the
# seeded fixtures. Used by:
#   - scripts/run_eval.py     — measures accuracy of any provider config
#   - scripts/run_ablation.py — runs 5 variants (mock, vanilla LLM, +prompt,
#                               +sanity, full) and produces the thesis tables
#   - tests/test_eval_smoke.py — pytest gate at ≥95% mock accuracy
#
# Schema:
#   truck_plate         : seeded plate number (must exist in trucks table)
#   load_id             : seeded load_requests.id
#   expected_compliant  : true | false
#   rule_category       : one of {temperature, pharma_logger, chemicals_quarantine,
#                                 forbidden_prior_cargo, wash_override, clean_path,
#                                 multi_blocker} — used for per-rule accuracy charts
#   expected_blocker    : (optional) substring of a rule-id we expect among cited_rule_ids when blocked
#   rationale           : human-readable why; useful for review
#
# Coverage targets (75 rows, ~10-12 per rule_category):
#   - temperature           : 12 rows  (capability mismatch + matching combos)
#   - pharma_logger         :  6 rows  (logger required vs. present)
#   - chemicals_quarantine  :  6 rows  (chemicals→food blocked, chemicals→chemicals OK)
#   - forbidden_prior_cargo : 12 rows  (raw_meat/poultry/chemicals priors with various loads)
#   - wash_override         :  9 rows  (ANSVSA wash valid + override-eligible loads)
#   - clean_path            : 18 rows  (truck has no compliance issues, all clean)
#   - multi_blocker         : 12 rows  (combinations: temp + logger, temp + forbidden, chemicals + temp)

cases:
  # =========================================================================
  # TEMPERATURE CAPABILITY (12 rows)
